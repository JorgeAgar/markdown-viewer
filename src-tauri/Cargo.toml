[package]
name = "markdown-viewer"
version = "0.1.0"
description = "Un visor de Markdown mínimo"
authors = ["Jorge Andrés Reyes Serrano"]
edition = "2021"
rust-version = "1.98"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
base64 = "0.22"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
