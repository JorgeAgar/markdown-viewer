name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      linux_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      linux_only:
        description: 'Run only the Linux build and Ubuntu/Arch validation'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.linux_only && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Build Linux tarball
        if: runner.os == 'Linux'
        run: pnpm build:linux
      - name: Build Windows or macOS installer
        if: runner.os != 'Linux'
        run: pnpm run build --bundles ${{ runner.os == 'Windows' && 'nsis' || 'dmg' }}
      - name: Test Linux WebView and measure startup
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb xdotool
          cargo install tauri-driver --locked
          mkdir -p artifacts/linux-extracted
          tar -xzf artifacts/packages/*.tar.gz -C artifacts/linux-extracted
          export MD_VIEWER_BINARY="$(find "$PWD/artifacts/linux-extracted" -type f -name markdown-viewer)"
          test -x "$MD_VIEWER_BINARY"
          ldd "$MD_VIEWER_BINARY" | tee artifacts/linux-ldd.txt
          if grep -q 'not found' artifacts/linux-ldd.txt; then exit 1; fi
          xvfb-run -a dbus-run-session -- pnpm test:e2e
          xvfb-run -a dbus-run-session -- pnpm run benchmark examples/bienvenido.md 5 > artifacts/benchmark.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: markdown-viewer-Linux
          path: artifacts/packages/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: markdown-viewer-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: linux-validation
          path: artifacts/

  validate-arch:
    needs: build
    runs-on: ubuntu-22.04
    container:
      image: archlinux:base-devel
      # Let WebKit create its sandbox namespaces inside Docker.
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    steps:
      - name: Arch dependencies
        run: |
          pacman -Syu --noconfirm --needed git webkit2gtk-4.1 \
            libappindicator-gtk3 librsvg dbus xorg-server-xvfb xorg-xauth ttf-dejavu
          useradd --create-home arch-test
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: markdown-viewer-Linux
          path: artifacts/packages
      - name: Validate Linux tarball on Arch and measure startup
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          mkdir -p artifacts/arch-extracted
          tar -xzf artifacts/packages/*.tar.gz -C artifacts/arch-extracted
          binary=$(find "$PWD/artifacts/arch-extracted" -type f -name markdown-viewer)
          test -x "$binary"
          ldd "$binary" | tee artifacts/arch-ldd.txt
          if grep -q 'not found' artifacts/arch-ldd.txt; then exit 1; fi
          # Run the WebView as a regular user so its sandbox can stay enabled.
          chown -R arch-test:arch-test artifacts
          runuser -u arch-test -- env MD_VIEWER_BINARY="$binary" \
            xvfb-run -a dbus-run-session -- node scripts/benchmark.mjs \
            examples/bienvenido.md 5 > artifacts/benchmark.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-validation
          path: |
            artifacts/arch-ldd.txt
            artifacts/benchmark.txt
